<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Finance Lab</title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIiB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiI+PHJlY3Qgd2lkdGg9IjUxMiIgaGVpZ2h0PSI1MTIiIGZpbGw9IiMwNTA1MDUiLz48dGV4dCB4PSI1MCUiIHk9IjUyJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9Im1vbm9zcGFjZSIgZm9udC1zaXplPSIyMjAiIGZvbnQtd2VpZ2h0PSI5MDAiIGZpbGw9IiMyZGQ0YmYiPkZMPC90ZXh0Pjwvc3ZnPg==">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; }
        .accent-glow { color: #2dd4bf; text-shadow: 0 0 8px rgba(45, 212, 191, 0.3); }
        input, select { background: #111 !important; border: 1px solid #222 !important; color: white !important; }
        input:focus, select:focus { border-color: #2dd4bf !important; outline: none; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }
        .pie-chart { border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { height: 6px; border-radius: 3px; background: #1f1f1f; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.5s ease; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Error:', err)); });
      }
    </script>
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const API_URL = "AQUI_PEGA_LA_URL_DE_APPS_SCRIPT"; // <--- REEMPLAZA ESTO

        const apiCall = async (action, payload = null) => {
            const response = await fetch(API_URL, {
                method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload })
            });
            const text = await response.text();
            try {
                const res = JSON.parse(text);
                if (!res.success) throw new Error(res.error);
                return res.data;
            } catch (e) { throw new Error("Error del Servidor Google."); }
        };

        const COLORES_PASTEL = ['#2dd4bf', '#0ea5e9', '#8b5cf6', '#f43f5e', '#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#14b8a6', '#6366f1'];
        const getHoyStr = () => {
            const hoy = new Date(); const offset = hoy.getTimezoneOffset() * 60000;
            return (new Date(hoy - offset)).toISOString().split('T')[0];
        };

        // --- GESTOR DE CUENTAS (ACTIVOS/PASIVOS) ---
        const CuentasManager = ({ cuentas, logs, loadData }) => {
            const [form, setForm] = useState({ nombre: '', tipo: 'Activo', saldoInicial: 0, propietario: 'Josué' });
            const [migrando, setMigrando] = useState(null);
            const [cuentaDestino, setCuentaDestino] = useState('');

            const guardarCuenta = () => {
                if(!form.nombre) return;
                apiCall('guardarNuevaCuenta', form).then(() => { setForm({ nombre: '', tipo: 'Activo', saldoInicial: 0, propietario: 'Josué' }); loadData(); });
            };

            const procesarBorrado = (cuentaBorrar) => {
                if(!cuentaDestino) return alert("Selecciona a qué cuenta mover el historial");
                apiCall('eliminarYMigrarCuenta', { cuentaBorrar, cuentaDestino }).then(() => { setMigrando(null); loadData(); });
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="glass-card p-6 md:p-8">
                        <h2 className="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-6 border-b border-zinc-800 pb-2">Gestor de Cuentas</h2>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 bg-zinc-900/50 p-4 rounded border border-zinc-800">
                            <div><label className="text-[10px] font-bold text-zinc-500 uppercase mb-1 block">Nombre</label><input className="w-full p-2 text-xs rounded" value={form.nombre} onChange={e=>setForm({...form, nombre: e.target.value})} /></div>
                            <div><label className="text-[10px] font-bold text-zinc-500 uppercase mb-1 block">Tipo</label><select className="w-full p-2 text-xs rounded" value={form.tipo} onChange={e=>setForm({...form, tipo: e.target.value})}><option>Activo</option><option>Pasivo</option></select></div>
                            <div><label className="text-[10px] font-bold text-zinc-500 uppercase mb-1 block">Propietario</label><select className="w-full p-2 text-xs rounded" value={form.propietario} onChange={e=>setForm({...form, propietario: e.target.value})}><option>Josué</option><option>Abi</option><option>Hogar</option></select></div>
                            <div><label className="text-[10px] font-bold text-zinc-500 uppercase mb-1 block">Saldo Inicial / Límite</label>
                                <div className="flex gap-2"><input type="number" className="w-full p-2 text-xs rounded font-mono text-teal-400" value={form.saldoInicial} onChange={e=>setForm({...form, saldoInicial: e.target.value})} /><button onClick={guardarCuenta} className="bg-[#2dd4bf] text-black px-4 rounded font-bold hover:bg-white">+</button></div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {cuentas.map(c => {
                                let balance = c.saldoInicial;
                                logs.forEach(l => {
                                    const m = Number(l.Monto_Total) || 0;
                                    if (l.Metodo_Pago === c.nombre) {
                                        if (l.Tipo_Operacion === 'Gasto' || l.Tipo_Operacion === 'Transferencia' || l.Tipo_Operacion === 'Abono') balance -= m;
                                        else if (l.Tipo_Operacion === 'Ingreso') balance += m;
                                    }
                                    if ((l.Tipo_Operacion === 'Transferencia' || l.Tipo_Operacion === 'Abono') && l.Cuenta_Destino === c.nombre) balance += m;
                                });
                                const esPasivo = c.tipo === 'Pasivo';
                                
                                return (
                                    <div key={c.nombre} className={`bg-zinc-900 border border-zinc-800 p-4 rounded relative overflow-hidden ${esPasivo ? 'border-l-4 border-l-rose-500' : 'border-l-4 border-l-teal-500'}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <div><h3 className="font-bold text-sm text-zinc-200">{c.nombre}</h3><span className="text-[9px] text-zinc-500 uppercase">{c.propietario} • {c.tipo}</span></div>
                                            <button onClick={()=>setMigrando(c.nombre)} className="text-zinc-600 hover:text-rose-500">🗑️</button>
                                        </div>
                                        <p className={`text-xl font-mono mt-2 font-bold ${esPasivo ? 'text-rose-400' : 'text-teal-400'}`}>${(esPasivo ? balance * -1 : balance).toLocaleString('es-MX', {minimumFractionDigits: 2})}</p>
                                        
                                        {migrando === c.nombre && (
                                            <div className="mt-3 pt-3 border-t border-zinc-800">
                                                <label className="text-[9px] text-rose-400 block mb-1">Migrar historial a:</label>
                                                <div className="flex gap-2"><select className="w-full p-1 text-[10px] rounded bg-black" value={cuentaDestino} onChange={e=>setCuentaDestino(e.target.value)}><option value="">-- Seleccionar --</option>{cuentas.filter(x=>x.nombre!==c.nombre).map(x=><option key={x.nombre}>{x.nombre}</option>)}</select><button onClick={()=>procesarBorrado(c.nombre)} className="bg-rose-500 text-white px-2 py-1 text-[10px] rounded">SÍ</button><button onClick={()=>setMigrando(null)} className="text-zinc-500 text-[10px]">X</button></div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ rawLogs, presupuesto, cuentas, onEdit }) => {
            const [viewScope, setViewScope] = useState('Compartido');
            const [deletingLog, setDeletingLog] = useState(null);

            const mapCuentas = useMemo(() => {
                let map = {}; cuentas.forEach(c => map[c.nombre] = c.propietario); return map;
            }, [cuentas]);

            const periodosDisponibles = useMemo(() => {
                const periodos = [...new Set((rawLogs || []).map(l => l.Periodo_Pago))].filter(Boolean);
                return periodos.sort((a, b) => { try { const pA = String(a).split('/'); const pB = String(b).split('/'); return new Date(pB[2], pB[1]-1, pB[0]) - new Date(pA[2], pA[1]-1, pA[0]); } catch(e) { return 0; } });
            }, [rawLogs]);

            const getPeriodoActual = () => { const hoy = new Date(); let m = hoy.getMonth(), a = hoy.getFullYear(); if (hoy.getDate() > 19) m += 1; const u = new Date(a, m + 1, 0); return `${String(u.getDate()).padStart(2, '0')}/${String(u.getMonth() + 1).padStart(2, '0')}/${u.getFullYear()}`; };
            const [periodoActivo, setPeriodoActivo] = useState(periodosDisponibles.includes(getPeriodoActual()) ? getPeriodoActual() : (periodosDisponibles[0] || getPeriodoActual()));
            const [hiddenTipos, setHiddenTipos] = useState([]);
            useEffect(() => { setHiddenTipos([]); }, [viewScope, periodoActivo]);

            const logsGlobal = useMemo(() => (rawLogs || []).filter(l => l.Periodo_Pago === periodoActivo), [rawLogs, periodoActivo]);
            
            // Ocultamos transferencias e ingresos del gráfico de gastos
            const logsScope = useMemo(() => logsGlobal.filter(l => {
                if (l.Tipo_Operacion === 'Abono' || l.Tipo_Operacion === 'Transferencia' || l.Tipo_Operacion === 'Ingreso') return false;
                if (viewScope === 'Compartido') return !l.Tipo_Gasto.includes('Personal');
                if (viewScope === 'Josue') return Number(l.Participacion_Josue) > 0;
                if (viewScope === 'Abi') return Number(l.Participacion_Abi) > 0;
                return false;
            }), [logsGlobal, viewScope]);

            const availableTipos = useMemo(() => [...new Set(logsScope.map(l => l.Tipo_Gasto))], [logsScope]);
            const logsFiltered = useMemo(() => logsScope.filter(l => !hiddenTipos.includes(l.Tipo_Gasto)), [logsScope, hiddenTipos]);

            const abonos = logsGlobal.filter(l => l.Tipo_Operacion === 'Abono').reduce((acc, curr) => acc + Math.abs(Number(curr.Monto_Parcial) || 0), 0);
            
            // Deuda calculada inteligentemente leyendo las cuentas
            const deudaAbi = logsGlobal.reduce((acc, curr) => {
                const monto = Number(curr.Monto_Parcial) || 0;
                if (curr.Tipo_Operacion === 'Abono') {
                    if (mapCuentas[curr.Metodo_Pago] === 'Abi' && mapCuentas[curr.Cuenta_Destino] === 'Josué') return acc - monto;
                    if (mapCuentas[curr.Metodo_Pago] === 'Josué' && mapCuentas[curr.Cuenta_Destino] === 'Abi') return acc + monto;
                    return acc;
                }
                if (curr.Tipo_Operacion === 'Gasto') {
                    const pJ = Number(curr.Participacion_Josue) || 0, pA = Number(curr.Participacion_Abi) || 0;
                    const prop = mapCuentas[curr.Metodo_Pago];
                    if (prop === 'Josué') return acc + pA;
                    if (prop === 'Abi') return acc - pJ;
                }
                return acc;
            }, 0);

            const totalGastoView = logsFiltered.reduce((acc, l) => {
                if (viewScope === 'Compartido') return acc + Number(l.Monto_Parcial);
                if (viewScope === 'Josue') return acc + Number(l.Participacion_Josue);
                if (viewScope === 'Abi') return acc + Number(l.Participacion_Abi);
                return acc;
            }, 0);

            const categoriasData = useMemo(() => {
                let map = {};
                logsFiltered.forEach(l => {
                    let amt = 0;
                    if (viewScope === 'Compartido') amt = Number(l.Monto_Parcial);
                    if (viewScope === 'Josue') amt = Number(l.Participacion_Josue);
                    if (viewScope === 'Abi') amt = Number(l.Participacion_Abi);
                    if (amt > 0) map[l.Categoria] = (map[l.Categoria] || 0) + amt;
                });
                return Object.keys(map).map(k => ({ nombre: k, total: map[k] })).sort((a,b) => b.total - a.total);
            }, [logsFiltered, viewScope]);

            const currentPresupuesto = presupuesto[viewScope] || {};
            const categoriasParaRender = useMemo(() => {
                let cats = [...categoriasData]; 
                Object.keys(currentPresupuesto).forEach(catName => { if (currentPresupuesto[catName] > 0 && !cats.find(c => c.nombre === catName)) cats.push({ nombre: catName, total: 0 }); });
                return cats;
            }, [categoriasData, currentPresupuesto]);

            const construirConicGradient = () => {
                if (categoriasData.length === 0 || totalGastoView === 0) return "conic-gradient(#1f1f1f 0% 100%)";
                let gradientArr = [], porcentajeAcumulado = 0;
                categoriasData.forEach((cat, index) => {
                    const porcentaje = (cat.total / totalGastoView) * 100;
                    gradientArr.push(`${COLORES_PASTEL[index % COLORES_PASTEL.length]} ${porcentajeAcumulado}% ${porcentajeAcumulado + porcentaje}%`);
                    porcentajeAcumulado += porcentaje;
                });
                return `conic-gradient(${gradientArr.join(', ')})`;
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="glass-card p-4 flex flex-col gap-3">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex gap-2 bg-zinc-900/50 p-1 rounded border border-zinc-800 w-full md:w-auto">
                                <button onClick={() => setViewScope('Compartido')} className={`px-4 py-2 text-[10px] font-bold uppercase rounded flex-1 md:flex-none transition-colors ${viewScope === 'Compartido' ? 'bg-[#2dd4bf] text-black' : 'text-zinc-500 hover:text-white'}`}>Hogar</button>
                                <button onClick={() => setViewScope('Josue')} className={`px-4 py-2 text-[10px] font-bold uppercase rounded flex-1 md:flex-none transition-colors ${viewScope === 'Josue' ? 'bg-[#2dd4bf] text-black' : 'text-zinc-500 hover:text-white'}`}>Josué</button>
                                <button onClick={() => setViewScope('Abi')} className={`px-4 py-2 text-[10px] font-bold uppercase rounded flex-1 md:flex-none transition-colors ${viewScope === 'Abi' ? 'bg-[#2dd4bf] text-black' : 'text-zinc-500 hover:text-white'}`}>Abi</button>
                            </div>
                            <div className="flex items-center gap-3 w-full md:w-auto">
                                <span className="text-[10px] uppercase tracking-widest text-zinc-500 font-bold whitespace-nowrap">Corte Operativo</span>
                                <select className="p-2 text-sm bg-zinc-900 rounded border border-zinc-800 w-full md:w-auto" value={periodoActivo} onChange={e => setPeriodoActivo(e.target.value)}>
                                    {periodosDisponibles.map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>
                        </div>
                        {availableTipos.length > 0 && (
                            <div className="border-t border-zinc-800/50 pt-3 flex flex-wrap gap-2 items-center fade-in">
                                {availableTipos.map(tipo => {
                                    const isActive = !hiddenTipos.includes(tipo);
                                    return (
                                        <button key={tipo} onClick={() => { if (isActive) setHiddenTipos([...hiddenTipos, tipo]); else setHiddenTipos(hiddenTipos.filter(t => t !== tipo)); }} className={`px-3 py-1 text-[9px] font-bold uppercase rounded-full transition-all border ${isActive ? 'bg-[#2dd4bf]/10 border-[#2dd4bf]/50 text-[#2dd4bf]' : 'bg-transparent border-zinc-800 text-zinc-600'}`}>{tipo}</button>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="glass-card p-6">
                            <p className="text-[10px] text-zinc-500 uppercase tracking-widest">Gasto {viewScope}</p>
                            <p className="text-3xl font-bold accent-glow mt-1">${totalGastoView.toLocaleString('es-MX', {minimumFractionDigits: 2})}</p>
                        </div>
                        <div className={`glass-card p-6 border-l-4 ${deudaAbi === 0 ? 'border-teal-500' : (deudaAbi > 0 ? 'border-rose-500' : 'border-amber-500')}`}>
                            <p className="text-[10px] text-zinc-500 uppercase tracking-widest">Estado Global (Hogar)</p>
                            <p className={`text-2xl font-bold mt-1 ${deudaAbi === 0 ? 'text-teal-400' : 'text-white'}`}>{deudaAbi === 0 ? 'Saldado ✓' : (deudaAbi > 0 ? `Abi debe $${deudaAbi.toLocaleString('es-MX', {minimumFractionDigits: 2})}` : `Josué debe $${Math.abs(deudaAbi).toLocaleString('es-MX', {minimumFractionDigits: 2})}`)}</p>
                        </div>
                        <div className="glass-card p-6">
                            <p className="text-[10px] text-zinc-500 uppercase tracking-widest">Abonos Recibidos</p>
                            <p className="text-3xl font-bold text-teal-600 mt-1">${abonos.toLocaleString('es-MX', {minimumFractionDigits: 2})}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="glass-card p-6 flex flex-col items-center justify-center">
                            <h3 className="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-6 w-full text-left">Distribución</h3>
                            <div className="pie-chart w-48 h-48 md:w-56 md:h-56 mb-6 transition-all" style={{ background: construirConicGradient() }}></div>
                        </div>
                        <div className="glass-card p-6 overflow-y-auto max-h-80">
                            <ul className="space-y-5">
                                {categoriasParaRender.map((catObj, i) => {
                                    const cat = catObj.nombre; const gastado = catObj.total; const meta = currentPresupuesto[cat] || 0;
                                    if (gastado === 0 && meta === 0) return null; const pct = meta > 0 ? (gastado / meta) * 100 : 0;
                                    return (
                                        <li key={cat} className="text-xs">
                                            <div className="flex justify-between items-center mb-1">
                                                <div className="flex items-center gap-3"><span className="w-4 h-4 rounded-full" style={{backgroundColor: gastado > 0 ? COLORES_PASTEL[i % COLORES_PASTEL.length] : '#333'}}></span><span className="text-zinc-300 font-medium">{cat}</span></div>
                                                <div className="text-right"><span className={`font-mono ${meta > 0 && pct > 100 ? 'text-rose-500' : 'text-teal-400'}`}>${gastado.toLocaleString('es-MX')}</span>{meta > 0 && <span className="text-[9px] text-zinc-500"> / ${meta.toLocaleString()}</span>}</div>
                                            </div>
                                            {meta > 0 && (
                                                <div className="flex items-center gap-3 mt-2"><div className="progress-bar flex-grow"><div className="progress-fill" style={{ width: `${Math.min(pct, 100)}%`, backgroundColor: pct > 100 ? '#f43f5e' : '#2dd4bf' }}></div></div><span className="text-[9px] font-mono font-bold w-10 text-right text-zinc-400">{pct.toFixed(1)}%</span></div>
                                            )}
                                        </li>
                                    );
                                })}
                            </ul>
                        </div>
                    </div>

                    <div className="glass-card overflow-x-auto">
                        <table className="w-full text-left text-[11px] whitespace-nowrap">
                            <thead className="bg-zinc-900 text-zinc-400 uppercase font-bold">
                                <tr><th className="p-3">Fecha</th><th className="p-3">Concepto</th><th className="p-3 text-teal-400">Categoría</th><th className="p-3">Cuenta / Flujo</th><th className="p-3">Ticket</th><th className="p-3">Aporte</th><th className="p-3 text-center">Acciones</th></tr>
                            </thead>
                            <tbody className="divide-y divide-zinc-900">
                                {logsFiltered.slice().reverse().map((log, idx) => {
                                    let aporte = 0;
                                    if (viewScope === 'Compartido') aporte = Number(log.Monto_Parcial);
                                    if (viewScope === 'Josue') aporte = Number(log.Participacion_Josue);
                                    if (viewScope === 'Abi') aporte = Number(log.Participacion_Abi);
                                    let transaccionStr = log.Metodo_Pago;
                                    if (log.Tipo_Operacion === 'Transferencia' || log.Tipo_Operacion === 'Abono') transaccionStr += ` ➔ ${log.Cuenta_Destino}`;

                                    return (
                                        <tr key={idx} className="hover:bg-zinc-900/50">
                                            <td className="p-3 text-zinc-500 font-mono">{log.Fecha_Compra}</td>
                                            <td className="p-3 font-bold text-zinc-200">{log.Compra}</td>
                                            <td className="p-3 text-zinc-400"><span className="text-[9px] text-zinc-600 block">{log.MacroCategoria}</span>{log.Categoria}</td>
                                            <td className="p-3 text-zinc-500">{transaccionStr}</td>
                                            <td className="p-3 font-mono text-zinc-500">${Number(log.Monto_Parcial).toLocaleString()}</td>
                                            <td className="p-3 font-mono text-teal-400">${aporte.toLocaleString('es-MX', {minimumFractionDigits: 2})}</td>
                                            <td className="p-3 text-center">
                                                {deletingLog === log.ID_Unico ? (
                                                    <div className="flex gap-2 justify-center font-bold"><button onClick={() => { setDeletingLog(null); apiCall('eliminarGasto', log.ID_Unico).then(()=>document.getElementById('refreshBtn').click()); }} className="text-rose-500 px-2 bg-rose-500/10 rounded">SÍ</button><button onClick={() => setDeletingLog(null)} className="text-zinc-500 px-2">NO</button></div>
                                                ) : (
                                                    <div className="flex gap-3 justify-center items-center"><button onClick={() => onEdit(log)} className="text-zinc-500 hover:text-teal-400">✏️</button><button onClick={() => setDeletingLog(log.ID_Unico)} className="text-zinc-500 hover:text-rose-500">🗑️</button></div>
                                                )}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const BudgetEditor = ({ appData, setAppData, loadData }) => {
            const [planScope, setPlanScope] = useState('Compartido');
            const [saving, setSaving] = useState(false);
            const [success, setSuccess] = useState(false);
            const [newCatName, setNewCatName] = useState('');
            const [newMacroName, setNewMacroName] = useState('');
            const [renamingCat, setRenamingCat] = useState(null);
            const [tempName, setTempName] = useState('');
            const [deletingCat, setDeletingCat] = useState(null);

            const handleSave = () => {
                if(!navigator.onLine) return alert("Necesitas conexión.");
                setSaving(true);
                apiCall('guardarPresupuestoGlobal', appData).then(() => { setSaving(false); setSuccess(true); setTimeout(() => setSuccess(false), 2500); });
            };

            const addCat = () => {
                const name = newCatName.trim(); const macro = newMacroName.trim() || 'General';
                if(!navigator.onLine) return alert("Necesitas conexión.");
                if(name !== '' && !appData.masterCategorias.includes(name)) { apiCall('agregarCategoriaMaster', {newName: name, macro: macro}).then(()=>loadData()); setNewCatName(''); setNewMacroName(''); }
            };

            const confirmRename = (old) => {
                const val = tempName.trim();
                if(!navigator.onLine) return alert("Necesitas conexión.");
                if(val !== '' && val !== old) apiCall('renombrarCategoria', {oldName: old, newName: val}).then(()=>loadData());
                setRenamingCat(null);
            };

            const confirmDeleteCategory = (cat) => { if(!navigator.onLine) return alert("Necesitas conexión."); setDeletingCat(null); apiCall('eliminarCategoriaMaster', cat).then(() => loadData()); };
            const total = Object.values(appData.presupuesto[planScope] || {}).reduce((a, b) => a + b, 0);

            const groupedCats = {};
            appData.masterCategorias.forEach(c => {
                let m = "General"; Object.keys(appData.arbolMacro).forEach(key => { if (appData.arbolMacro[key].includes(c)) m = key; });
                if (!groupedCats[m]) groupedCats[m] = []; groupedCats[m].push(c);
            });

            return (
                <div className="glass-card p-6 md:p-8 max-w-2xl mx-auto fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-end border-b border-zinc-800 pb-6 mb-8 gap-4">
                        <div className="w-full md:w-auto">
                            <h2 className="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-4">Límites Mensuales</h2>
                            <div className="flex gap-2 bg-zinc-900/50 p-1 rounded border border-zinc-800">
                                {['Compartido', 'Josue', 'Abi'].map(s => <button key={s} onClick={() => setPlanScope(s)} className={`px-4 py-2 text-[10px] font-bold uppercase rounded ${planScope === s ? 'bg-[#2dd4bf] text-black' : 'text-zinc-500'}`}>{s === 'Compartido' ? 'Hogar' : s}</button>)}
                            </div>
                        </div>
                        <div className="text-right w-full md:w-auto">
                            <p className="text-[10px] text-teal-400 font-bold uppercase mb-1">Presupuesto {planScope}</p>
                            <p className="text-2xl font-black text-white mb-3">${total.toLocaleString()}</p>
                            <button disabled={saving || success} onClick={handleSave} className={`w-full md:w-auto px-6 py-2 rounded text-[10px] font-black uppercase transition-all ${success ? 'bg-teal-400 text-black' : 'bg-[#2dd4bf] text-black hover:bg-white'}`}>
                                {saving ? 'Sincronizando...' : (success ? '✅ ¡Guardado!' : 'Guardar Cambios')}
                            </button>
                        </div>
                    </div>

                    <div className="space-y-6 mb-10">
                        {Object.keys(groupedCats).map(macro => (
                            <div key={macro}>
                                <h3 className="text-[10px] text-teal-500 font-bold uppercase tracking-widest mb-2 border-b border-zinc-800 pb-1">{macro}</h3>
                                <div className="space-y-2">
                                    {groupedCats[macro].map(c => (
                                        <div key={c} className="flex justify-between items-center bg-zinc-900/30 p-3 rounded border border-zinc-800/50">
                                            <span className="text-[11px] uppercase text-zinc-300 font-medium pl-2 border-l-2 border-zinc-700">{c}</span>
                                            <div className="flex items-center gap-2"><span className="text-zinc-600 text-[10px]">$</span><input type="number" className="w-24 p-2 rounded text-xs text-right bg-black text-teal-400 font-bold" value={appData.presupuesto[planScope][c] || ''} onChange={e => setAppData({...appData, presupuesto: {...appData.presupuesto, [planScope]: {...appData.presupuesto[planScope], [c]: Number(e.target.value)}}})} /></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="border-t border-zinc-800 pt-8">
                        <h3 className="text-xs font-bold uppercase text-zinc-500 tracking-widest mb-4">Gestor Master de Categorías</h3>
                        <div className="flex gap-2 mb-6 bg-zinc-900 p-2 rounded">
                            <input className="w-1/3 p-2 text-xs rounded bg-black" placeholder="Macro (Ej. Fijos)" value={newMacroName} onChange={e => setNewMacroName(e.target.value)} />
                            <input className="w-full p-2 text-xs rounded bg-black" placeholder="Nueva Micro-categoría..." value={newCatName} onChange={e => setNewCatName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCat()} />
                            <button onClick={addCat} className="bg-zinc-800 px-4 rounded font-bold text-white hover:bg-teal-500">+</button>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {appData.masterCategorias.map(c => (
                                <div key={c} className="bg-zinc-900 border border-zinc-800 px-3 py-1 rounded flex items-center gap-3 text-[10px]">
                                    {renamingCat === c ? (
                                        <input autoFocus className="bg-black text-teal-400 w-24 outline-none border-b border-teal-500" value={tempName} onChange={e=>setTempName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&confirmRename(c)} onBlur={()=>confirmRename(c)} />
                                    ) : <span className="text-zinc-300 font-bold">{c}</span>}
                                    
                                    {deletingCat === c ? (
                                        <div className="flex gap-2 font-bold ml-2"><button onClick={()=>confirmDeleteCategory(c)} className="text-rose-500 px-1 bg-rose-500/10 rounded">SÍ</button><button onClick={()=>setDeletingCat(null)} className="text-zinc-500">NO</button></div>
                                    ) : (
                                        <div className="flex gap-2 border-l border-zinc-800 pl-2 ml-2"><button onClick={()=>{setRenamingCat(c); setTempName(c);}} className="text-zinc-500 hover:text-teal-400">✏️</button>{c !== 'Otro' && <button onClick={()=>setDeletingCat(c)} className="text-zinc-500 hover:text-rose-500">🗑️</button>}</div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dash'); 
            const [loadingInitial, setLoadingInitial] = useState(true);
            const [savingGasto, setSavingGasto] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false);
            const [showOffline, setShowOffline] = useState(false);
            
            const [appData, setAppData] = useState({ rawLogs: [], presupuesto: { Compartido: {}, Josue: {}, Abi: {} }, masterCategorias: [], arbolMacro: {}, cuentas: [] });
            const [configProporcion, setConfigProporcion] = useState({ josue: 53, abi: 47 });
            const [form, setForm] = useState({ id_edit: null, tipoOperacion: 'Gasto', fechaCompra: getHoyStr(), registrador: 'Josué', compra: '', monto: '', macroCategoria: 'General', categoria: '', metodo: '', cuentaDestino: '', tipoGasto: 'Compartido (50/50)', msi: '1' });

            const syncOfflineQueue = async () => {
                if (!navigator.onLine) return;
                const queue = JSON.parse(localStorage.getItem('fl_offline_queue') || '[]');
                if (queue.length === 0) return;
                let pending = [];
                for (let req of queue) { try { await apiCall(req.action, req.payload); } catch (e) { pending.push(req); } }
                localStorage.setItem('fl_offline_queue', JSON.stringify(pending));
                if (pending.length === 0) loadData(); 
            };

            useEffect(() => {
                window.addEventListener('online', syncOfflineQueue);
                return () => window.removeEventListener('online', syncOfflineQueue);
            }, []);

            useEffect(() => { loadData(); }, []);

            useEffect(() => {
                if (appData.masterCategorias.length > 0 && !form.categoria && !form.id_edit) {
                    const defaultMacro = Object.keys(appData.arbolMacro)[0] || 'General';
                    setForm(prev => ({
                        ...prev, 
                        macroCategoria: defaultMacro,
                        categoria: appData.arbolMacro[defaultMacro]?.[0] || appData.masterCategorias[0],
                        metodo: appData.cuentas[0]?.nombre || '',
                        cuentaDestino: appData.cuentas[1]?.nombre || ''
                    }));
                }
            }, [appData]);

            const loadData = () => {
                if (!navigator.onLine) { setLoadingInitial(false); return; }
                setLoadingInitial(true);
                apiCall('getAppData').then(data => { setAppData(data); setLoadingInitial(false); syncOfflineQueue(); }).catch(err => { setLoadingInitial(false); });
            };

            const triggerEdit = (log) => {
                const [d, m, y] = log.Fecha_Compra.split('/');
                let parseTipo = log.Tipo_Gasto;
                if (parseTipo.includes('Proporcional')) {
                    parseTipo = 'Proporcional'; const match = log.Tipo_Gasto.match(/\((\d+)\/(\d+)\)/);
                    if(match) setConfigProporcion({ josue: Number(match[1]), abi: Number(match[2]) });
                }
                setForm({ 
                    id_edit: log.ID_Unico, tipoOperacion: log.Tipo_Operacion || 'Gasto', fechaCompra: `${y}-${m}-${d}`, 
                    registrador: log.Registrador, compra: log.Compra, monto: log.Monto_Parcial, 
                    macroCategoria: log.MacroCategoria || 'General', categoria: log.Categoria, 
                    metodo: log.Metodo_Pago, cuentaDestino: log.Cuenta_Destino || '', tipoGasto: parseTipo, msi: '1' 
                });
                setView('gasto');
            };

            const saveGasto = (esAbono = false) => {
                if(!form.monto || (!form.compra && !esAbono)) return alert("Faltan datos requeridos");
                setSavingGasto(true);
                let tipoFinal = form.tipoGasto;
                if (tipoFinal === 'Proporcional') tipoFinal = `Proporcional (${configProporcion.josue}/${configProporcion.abi})`;
                const p = { ...form, tipoGasto: tipoFinal, pctJosue: configProporcion.josue, pctAbi: configProporcion.abi, esAbono };
                const fn = form.id_edit ? 'editarGasto' : 'registrarGasto';

                if (!navigator.onLine) {
                    const queue = JSON.parse(localStorage.getItem('fl_offline_queue') || '[]');
                    queue.push({ action: fn, payload: p });
                    localStorage.setItem('fl_offline_queue', JSON.stringify(queue));
                    setSavingGasto(false); setShowOffline(true);
                    setTimeout(() => { 
                        setShowOffline(false); 
                        setForm({ ...form, id_edit: null, compra: '', monto: '', msi: '1' }); 
                    }, 2000);
                    return;
                }

                apiCall(fn, p).then(() => {
                    setSavingGasto(false); setShowSuccess(true);
                    setTimeout(() => { setShowSuccess(false); setForm({ ...form, id_edit: null, compra: '', monto: '', msi: '1' }); }, 1500);
                }).catch(err => { setSavingGasto(false); alert("Error de servidor."); });
            };

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-6 pb-20">
                    <button id="refreshBtn" className="hidden" onClick={loadData}></button>
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-zinc-900 pb-6 gap-4">
                        <div><h1 className="text-2xl font-black uppercase tracking-tighter">Finance<span className="text-teal-500">Lab</span></h1><p className="text-[9px] text-zinc-500 tracking-[0.3em]">HOGAR JOSUÉ & ABIGAIL</p></div>
                        <nav className="flex gap-2 bg-zinc-900/50 p-1 rounded border border-zinc-800">
                            {['gasto', 'abono', 'cuentas', 'dash', 'plan'].map(v => (
                                <button key={v} onClick={() => { if(v==='dash'||v==='plan'||v==='cuentas') loadData(); setView(v); setForm(prev => ({...prev, id_edit: null})); }} className={`px-4 py-2 text-[10px] font-bold uppercase rounded transition-colors ${view === v ? 'bg-[#2dd4bf] text-black' : 'text-zinc-500 hover:text-white'}`}>
                                    {v==='dash'?'Tablero':v==='plan'?'Plan':v}
                                </button>
                            ))}
                        </nav>
                    </header>

                    {loadingInitial && view !== 'gasto' && view !== 'abono' && view !== 'cuentas' ? <div className="text-center mt-20 font-mono text-zinc-500 animate-pulse">Sincronizando Core...</div> : (
                        view === 'gasto' ? (
                            <div className="glass-card p-6 md:p-8 max-w-2xl mx-auto fade-in">
                                <div className="flex justify-between items-center mb-6 border-b border-zinc-800 pb-2">
                                    <h2 className="text-xs font-bold uppercase tracking-widest text-zinc-500">{form.id_edit ? <span className="text-teal-400">✏️ MODO EDICIÓN</span> : 'Registro de Operaciones'}</h2>
                                    {form.id_edit && <button onClick={() => setForm({...form, id_edit: null, compra: '', monto: ''})} className="text-[9px] uppercase text-zinc-500 hover:text-white bg-zinc-900 px-2 py-1 rounded">Cancelar</button>}
                                </div>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Tipo</label><select className="w-full p-3 rounded text-xs text-teal-400 font-bold" value={form.tipoOperacion} onChange={e => setForm({...form, tipoOperacion: e.target.value})}><option>Gasto</option><option>Ingreso</option><option>Transferencia</option></select></div>
                                        <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Fecha</label><input type="date" className="w-full p-3 rounded font-mono text-xs" value={form.fechaCompra} onChange={e => setForm({...form, fechaCompra: e.target.value})} /></div>
                                    </div>
                                    <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Concepto</label><input className="w-full p-3 rounded" placeholder="Ej. Quincena, Desayuno..." value={form.compra} onChange={e => setForm({...form, compra: e.target.value})} /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Monto Total</label><input type="number" step="0.01" className="w-full p-3 rounded font-mono" placeholder="0.00" value={form.monto} onChange={e => setForm({...form, monto: e.target.value})} /></div>
                                        <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Registrador</label><select className="w-full p-3 rounded text-xs" value={form.registrador} onChange={e => setForm({...form, registrador: e.target.value})}><option>Josué</option><option>Abigail</option></select></div>
                                    </div>

                                    {form.tipoOperacion !== 'Transferencia' ? (
                                        <div className="grid grid-cols-2 gap-4 bg-zinc-900/50 p-3 rounded border border-zinc-800">
                                            <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Macro Categoría</label><select className="w-full p-3 rounded text-xs" value={form.macroCategoria} onChange={e => setForm({...form, macroCategoria: e.target.value, categoria: appData.arbolMacro[e.target.value]?.[0] || ''})}>{Object.keys(appData.arbolMacro).map(m=><option key={m}>{m}</option>)}</select></div>
                                            <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Sub-Categoría</label><select className="w-full p-3 rounded text-xs" value={form.categoria} onChange={e => setForm({...form, categoria: e.target.value})}>{(appData.arbolMacro[form.macroCategoria]||[]).map(c=><option key={c}>{c}</option>)}</select></div>
                                        </div>
                                    ) : null}

                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">{form.tipoOperacion === 'Transferencia' ? 'Cuenta ORIGEN' : 'Cuenta / Método'}</label><select className="w-full p-3 rounded text-xs" value={form.metodo} onChange={e => setForm({...form, metodo: e.target.value})}>{appData.cuentas.map(c=><option key={c.nombre} value={c.nombre}>{c.nombre}</option>)}</select></div>
                                        {form.tipoOperacion === 'Transferencia' ? (
                                            <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Cuenta DESTINO</label><select className="w-full p-3 rounded text-xs" value={form.cuentaDestino} onChange={e => setForm({...form, cuentaDestino: e.target.value})}>{appData.cuentas.map(c=><option key={c.nombre} value={c.nombre}>{c.nombre}</option>)}</select></div>
                                        ) : form.tipoOperacion === 'Gasto' ? (
                                            <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Distribución</label><select className="w-full p-3 rounded text-xs" value={form.tipoGasto} onChange={e => setForm({...form, tipoGasto: e.target.value})}><option>Compartido (50/50)</option><option value="Proporcional">Proporcional</option><option>Personal Josué</option><option>Personal Abi</option></select></div>
                                        ) : <div/>}
                                    </div>

                                    {form.tipoOperacion === 'Gasto' && form.tipoGasto === 'Proporcional' && (
                                        <div className="grid grid-cols-2 gap-4 p-4 bg-zinc-900 rounded border border-zinc-800 fade-in">
                                            <div><label className="text-[9px] text-zinc-400 uppercase block mb-1">Josué (%)</label><input type="number" className="w-full p-2 rounded text-xs bg-black text-teal-400 font-bold" value={configProporcion.josue} onChange={e => { setConfigProporcion({ josue: Number(e.target.value), abi: 100 - Number(e.target.value) }); }} /></div>
                                            <div><label className="text-[9px] text-zinc-400 uppercase block mb-1">Abi (%)</label><input type="number" className="w-full p-2 rounded text-xs bg-black text-teal-400 font-bold" value={configProporcion.abi} onChange={e => { setConfigProporcion({ josue: 100 - Number(e.target.value), abi: Number(e.target.value) }); }} /></div>
                                        </div>
                                    )}

                                    {!form.id_edit && form.tipoOperacion === 'Gasto' && (
                                        <div className="border-t border-zinc-800 pt-5"><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold flex justify-between"><span>Meses sin intereses (Opcional)</span></label><input type="number" min="1" className="w-full p-3 rounded font-mono max-w-[150px]" value={form.msi} onChange={e => setForm({...form, msi: e.target.value})} /></div>
                                    )}
                                    <button disabled={savingGasto || showSuccess || showOffline} onClick={() => saveGasto(false)} className={`w-full font-black p-4 rounded mt-4 uppercase tracking-[0.2em] text-xs transition-all shadow-[0_0_15px_rgba(45,212,191,0.2)] ${showOffline ? 'bg-amber-500 text-black' : (showSuccess ? 'bg-teal-400 text-black' : 'bg-[#2dd4bf] text-black hover:bg-white')}`}>
                                        {savingGasto ? 'Sincronizando...' : (showOffline ? '💾 Guardado (Offline)' : (showSuccess ? '✅ ¡Éxito!' : (form.id_edit ? 'Actualizar' : 'Asentar')))}
                                    </button>
                                </div>
                            </div>
                        ) : view === 'abono' ? (
                            <div className="glass-card p-6 md:p-8 max-w-lg mx-auto fade-in">
                                <h2 className="text-xs font-bold uppercase tracking-widest text-teal-500 mb-6 border-b border-zinc-800 pb-2">Registrar Abono a Deuda</h2>
                                <div className="space-y-5">
                                    <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Fecha del Abono</label><input type="date" className="w-full p-3 rounded font-mono text-xs" value={form.fechaCompra} onChange={e => setForm({...form, fechaCompra: e.target.value})} /></div>
                                    <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Monto Abonado</label><input type="number" step="0.01" className="w-full p-3 rounded font-mono text-2xl text-teal-400" placeholder="0.00" value={form.monto} onChange={e => setForm({...form, monto: e.target.value})} /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Desde Cuenta</label><select className="w-full p-3 rounded text-xs" value={form.metodo} onChange={e => setForm({...form, metodo: e.target.value})}>{appData.cuentas.map(c=><option key={c.nombre} value={c.nombre}>{c.nombre}</option>)}</select></div>
                                        <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Hacia Cuenta</label><select className="w-full p-3 rounded text-xs" value={form.cuentaDestino} onChange={e => setForm({...form, cuentaDestino: e.target.value})}>{appData.cuentas.map(c=><option key={c.nombre} value={c.nombre}>{c.nombre}</option>)}</select></div>
                                    </div>
                                    <button disabled={savingGasto || showSuccess || showOffline} onClick={() => saveGasto(true)} className={`w-full border-2 font-black p-4 rounded mt-4 uppercase tracking-[0.2em] text-xs transition-all ${showOffline ? 'border-amber-500 bg-amber-500 text-black' : (showSuccess ? 'border-teal-400 bg-teal-400 text-black' : 'border-[#2dd4bf] text-[#2dd4bf] hover:bg-[#2dd4bf] hover:text-black')}`}>
                                        {savingGasto ? 'Sincronizando...' : (showOffline ? '💾 En Espera (Offline)' : (showSuccess ? '✅ ¡Abono guardado!' : 'Liquidar Deuda'))}
                                    </button>
                                </div>
                            </div>
                        ) : view === 'cuentas' ? <CuentasManager cuentas={appData.cuentas} logs={appData.rawLogs} loadData={loadData} /> : view === 'plan' ? <BudgetEditor appData={appData} setAppData={setAppData} loadData={loadData} /> : <Dashboard rawLogs={appData.rawLogs} presupuesto={appData.presupuesto} cuentas={appData.cuentas} onEdit={triggerEdit} />
                    )}
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
