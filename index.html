<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Finance Lab ERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; }
        .accent-glow { color: #2dd4bf; text-shadow: 0 0 8px rgba(45, 212, 191, 0.3); }
        input, select { background: #111 !important; border: 1px solid #222 !important; color: white !important; }
        input:focus, select:focus { border-color: #2dd4bf !important; outline: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbweLm3Vqu8_9LusW0Y24jzkzw2IuTr7XHoWyuSKN_kIfJshRdkWXpV34tdjmmYUg2Yv/exec";

        const apiCall = async (action, payload = null) => {
            const response = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
            const res = await response.json();
            if (!res.success) throw new Error(res.error);
            return res.data;
        };

        const getHoyStr = () => new Date(new Date() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];

        const Dashboard = ({ rawLogs, presupuesto, cuentas }) => {
            const [viewScope, setViewScope] = useState('Compartido');
            const [deletingLog, setDeletingLog] = useState(null);

            const mapPropietarios = useMemo(() => {
                let map = {}; cuentas.forEach(c => map[c.nombre] = c.propietario); return map;
            }, [cuentas]);

            const periodos = useMemo(() => [...new Set(rawLogs.map(l => l.Periodo_Pago))].sort().reverse(), [rawLogs]);
            const [periodoActivo, setPeriodoActivo] = useState(periodos[0] || "");

            const logsGlobal = useMemo(() => rawLogs.filter(l => l.Periodo_Pago === periodoActivo), [rawLogs, periodoActivo]);
            const logsFiltered = useMemo(() => logsGlobal.filter(l => {
                if (l.Tipo_Operacion !== 'Gasto') return false;
                if (viewScope === 'Compartido') return !l.Tipo_Gasto.includes('Personal');
                if (viewScope === 'Josue') return Number(l.Participacion_Josue) > 0;
                if (viewScope === 'Abi') return Number(l.Participacion_Abi) > 0;
                return false;
            }), [logsGlobal, viewScope]);

            // CÁLCULO DE DEUDA INTEGRADO
            const deudaAbi = logsGlobal.reduce((acc, curr) => {
                const monto = Number(curr.Monto_Parcial) || 0;
                // Si es un Gasto compartido pagado por Josué, Abi debe su parte
                if (curr.Tipo_Operacion === 'Gasto') {
                    const prop = mapPropietarios[curr.Cuenta_Origen];
                    if (prop === 'Josué') return acc + (Number(curr.Participacion_Abi) || 0);
                    if (prop === 'Abi') return acc - (Number(curr.Participacion_Josue) || 0);
                }
                // Si es una Transferencia/Abono de Abi a cuenta de Josué, reduce deuda
                if (curr.Tipo_Operacion === 'Transferencia' || curr.Tipo_Operacion === 'Abono') {
                    if (mapPropietarios[curr.Cuenta_Origen] === 'Abi' && mapPropietarios[curr.Cuenta_Destino] === 'Josué') return acc - monto;
                    if (mapPropietarios[curr.Cuenta_Origen] === 'Josué' && mapPropietarios[curr.Cuenta_Destino] === 'Abi') return acc + monto;
                }
                return acc;
            }, 0);

            const totalGasto = logsFiltered.reduce((acc, l) => acc + (viewScope === 'Compartido' ? Number(l.Monto_Parcial) : (viewScope === 'Josue' ? Number(l.Participacion_Josue) : Number(l.Participacion_Abi))), 0);

            return (
                <div className="space-y-6 fade-in">
                    <div className="glass-card p-4 flex justify-between items-center">
                        <div className="flex gap-2">
                            {['Compartido', 'Josue', 'Abi'].map(s => <button key={s} onClick={()=>setViewScope(s)} className={`px-4 py-2 text-[10px] font-bold uppercase rounded ${viewScope === s ? 'bg-[#2dd4bf] text-black' : 'text-zinc-500'}`}>{s}</button>)}
                        </div>
                        <select className="p-2 text-xs rounded" value={periodoActivo} onChange={e=>setPeriodoActivo(e.target.value)}>{periodos.map(p=><option key={p}>{p}</option>)}</select>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="glass-card p-6">
                            <p className="text-[10px] text-zinc-500 uppercase tracking-widest">Gasto {viewScope}</p>
                            <p className="text-3xl font-bold accent-glow mt-1">${totalGasto.toLocaleString('es-MX', {minimumFractionDigits: 2})}</p>
                        </div>
                        <div className={`glass-card p-6 border-l-4 ${deudaAbi > 0 ? 'border-rose-500' : 'border-teal-500'}`}>
                            <p className="text-[10px] text-zinc-500 uppercase tracking-widest">Estado Global (Hogar)</p>
                            <p className="text-2xl font-bold mt-1">{deudaAbi === 0 ? 'Saldado ✓' : (deudaAbi > 0 ? `Abi debe $${deudaAbi.toLocaleString('es-MX')}` : `Josué debe $${Math.abs(deudaAbi).toLocaleString('es-MX')}`)}</p>
                        </div>
                    </div>

                    <div className="glass-card overflow-x-auto">
                        <table className="w-full text-left text-[11px] whitespace-nowrap">
                            <thead className="bg-zinc-900 text-zinc-400 uppercase font-bold">
                                <tr><th className="p-3">Fecha</th><th className="p-3">Concepto</th><th className="p-3">Cuenta</th><th className="p-3">Ticket</th><th className="p-3">Mi Aporte</th><th className="p-3 text-center">Acciones</th></tr>
                            </thead>
                            <tbody className="divide-y divide-zinc-900">
                                {logsFiltered.slice().reverse().map((log, idx) => (
                                    <tr key={idx} className="hover:bg-zinc-900/50">
                                        <td className="p-3 text-zinc-500 font-mono">{log.Fecha_Compra}</td>
                                        <td className="p-3 font-bold text-zinc-200">{log.Compra}</td>
                                        <td className="p-3 text-zinc-500">{log.Cuenta_Origen} {log.Cuenta_Destino && `➔ ${log.Cuenta_Destino}`}</td>
                                        <td className="p-3 font-mono text-zinc-500">${Number(log.Monto_Parcial).toLocaleString()}</td>
                                        <td className="p-3 font-mono text-teal-400">${(viewScope === 'Compartido' ? Number(log.Monto_Parcial) : (viewScope === 'Josue' ? Number(log.Participacion_Josue) : Number(log.Participacion_Abi))).toLocaleString()}</td>
                                        <td className="p-3 text-center"><button onClick={() => apiCall('eliminarGasto', log.ID_Unico).then(()=>window.location.reload())} className="text-zinc-600 hover:text-rose-500">🗑️</button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const CuentasManager = ({ cuentas, logs, loadData }) => {
            const [localCuentas, setLocalCuentas] = useState(cuentas);
            const [saving, setSaving] = useState(false);

            const handleEdit = (idx, field, val) => {
                const updated = [...localCuentas]; updated[idx][field] = field === 'saldoInicial' ? Number(val) : val;
                setLocalCuentas(updated);
            };

            const guardar = () => { setSaving(true); apiCall('guardarCuentas', localCuentas).then(() => { setSaving(false); loadData(); }); };

            return (
                <div className="glass-card p-6 md:p-8 fade-in">
                    <div className="flex justify-between items-center mb-6 border-b border-zinc-800 pb-3">
                        <h2 className="text-xs font-bold uppercase tracking-widest text-zinc-500">Configuración de Cuentas</h2>
                        <button onClick={guardar} className="bg-[#2dd4bf] text-black px-6 py-2 text-[10px] font-black uppercase rounded hover:bg-white">{saving ? 'Guardando...' : 'Aplicar Cambios'}</button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {localCuentas.map((c, i) => {
                            let balance = c.saldoInicial;
                            logs.forEach(l => {
                                const m = Number(l.Monto_Total) || 0;
                                if (l.Cuenta_Origen === c.nombre) {
                                    if (l.Tipo_Operacion === 'Gasto' || l.Tipo_Operacion === 'Transferencia' || l.Tipo_Operacion === 'Abono') balance -= m;
                                    else if (l.Tipo_Operacion === 'Ingreso') balance += m;
                                }
                                if ((l.Tipo_Operacion === 'Transferencia' || l.Tipo_Operacion === 'Abono') && l.Cuenta_Destino === c.nombre) balance += m;
                            });
                            return (
                                <div key={i} className="bg-zinc-900/50 p-4 rounded border border-zinc-800 space-y-3">
                                    <div className="flex justify-between">
                                        <input className="bg-transparent font-bold text-teal-400 outline-none w-1/2" value={c.nombre} onChange={e=>handleEdit(i, 'nombre', e.target.value)} />
                                        <select className="bg-transparent text-[9px] uppercase text-zinc-500" value={c.propietario} onChange={e=>handleEdit(i, 'propietario', e.target.value)}><option>Josué</option><option>Abi</option><option>Hogar</option></select>
                                    </div>
                                    <div className="flex items-end justify-between">
                                        <div><label className="text-[9px] text-zinc-600 block uppercase">Saldo Inicial</label><input type="number" className="bg-transparent font-mono text-sm w-24 outline-none" value={c.saldoInicial} onChange={e=>handleEdit(i, 'saldoInicial', e.target.value)} /></div>
                                        <div className="text-right"><label className="text-[9px] text-zinc-600 block uppercase">Balance Actual</label><p className="font-mono font-bold text-white text-lg">${balance.toLocaleString()}</p></div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dash');
            const [data, setData] = useState({ rawLogs: [], arbolCat: {}, cuentas: [], presupuesto: {} });
            const [loading, setLoading] = useState(true);
            const [form, setForm] = useState({ fechaCompra: getHoyStr(), registrador: 'Josué', tipoOperacion: 'Gasto', macroCategoria: '', categoria: '', compra: '', monto: '', cuentaOrigen: '', cuentaDestino: '', tipoGasto: 'Compartido (50/50)', msi: '1' });

            const loadData = () => { setLoading(true); apiCall('getAppData').then(res => { 
                setData(res); 
                const firstTipo = Object.keys(res.arbolCat)[0];
                const firstMacro = Object.keys(res.arbolCat[firstTipo] || {})[0];
                setForm(f => ({ ...f, tipoOperacion: firstTipo, macroCategoria: firstMacro, categoria: res.arbolCat[firstTipo]?.[firstMacro]?.[0] || '', cuentaOrigen: res.cuentas[0]?.nombre || '', cuentaDestino: res.cuentas[1]?.nombre || '' }));
                setLoading(false); 
            }); };

            useEffect(() => { loadData(); }, []);

            const registrar = () => {
                if(!form.compra || !form.monto) return alert("Faltan datos");
                setLoading(true);
                apiCall('registrarOperacion', form).then(() => { setForm({ ...form, compra: '', monto: '' }); loadData(); });
            };

            if (loading && !data.cuentas.length) return <div className="min-h-screen flex items-center justify-center font-mono text-zinc-500 animate-pulse">Sincronizando Core...</div>;

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-6 pb-20">
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-zinc-900 pb-6 gap-4">
                        <div><h1 className="text-2xl font-black uppercase tracking-tighter">Finance<span className="text-teal-500">Lab</span></h1><p className="text-[9px] text-zinc-500 tracking-[0.3em]">HOGAR JOSUÉ & ABIGAIL</p></div>
                        <nav className="flex gap-2 bg-zinc-900/50 p-1 rounded border border-zinc-800">
                            {['registro', 'dash', 'cuentas', 'plan'].map(v => <button key={v} onClick={()=>setView(v)} className={`px-4 py-2 text-[10px] font-bold uppercase rounded ${view === v ? 'bg-[#2dd4bf] text-black' : 'text-zinc-500'}`}>{v === 'dash' ? 'Tablero' : v}</button>)}
                        </nav>
                    </header>

                    {view === 'registro' && (
                        <div className="glass-card p-6 md:p-8 max-w-2xl mx-auto fade-in">
                            <h2 className="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-6 border-b border-zinc-800 pb-2">Nueva Operación</h2>
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Tipo</label><select className="w-full p-3 rounded text-xs" value={form.tipoOperacion} onChange={e=>setForm({...form, tipoOperacion: e.target.value, macroCategoria: Object.keys(data.arbolCat[e.target.value]||{})[0]})}>{Object.keys(data.arbolCat).concat(['Transferencia', 'Abono']).map(t=><option key={t}>{t}</option>)}</select></div>
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Fecha</label><input type="date" className="w-full p-3 rounded font-mono text-xs" value={form.fechaCompra} onChange={e=>setForm({...form, fechaCompra: e.target.value})} /></div>
                                </div>

                                {form.tipoOperacion !== 'Transferencia' && form.tipoOperacion !== 'Abono' && (
                                    <div className="grid grid-cols-2 gap-4 bg-zinc-900/50 p-3 rounded border border-zinc-800">
                                        <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Macro</label><select className="w-full p-2 text-xs rounded" value={form.macroCategoria} onChange={e=>setForm({...form, macroCategoria: e.target.value, categoria: data.arbolCat[form.tipoOperacion][e.target.value][0]})}>{Object.keys(data.arbolCat[form.tipoOperacion]||{}).map(m=><option key={m}>{m}</option>)}</select></div>
                                        <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Sub-Categoría</label><select className="w-full p-2 text-xs rounded" value={form.categoria} onChange={e=>setForm({...form, categoria: e.target.value})}>{(data.arbolCat[form.tipoOperacion]?.[form.macroCategoria]||[]).map(c=><option key={c}>{c}</option>)}</select></div>
                                    </div>
                                )}

                                <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Descripción</label><input className="w-full p-3 rounded text-xs" value={form.compra} onChange={e=>setForm({...form, compra: e.target.value})} /></div>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Monto</label><input type="number" className="w-full p-3 rounded font-mono text-teal-400" value={form.monto} onChange={e=>setForm({...form, monto: e.target.value})} /></div>
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Registrador</label><select className="w-full p-3 rounded text-xs" value={form.registrador} onChange={e=>setForm({...form, registrador: e.target.value})}><option>Josué</option><option>Abigail</option></select></div>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">{form.tipoOperacion === 'Transferencia' || form.tipoOperacion === 'Abono' ? 'Cuenta Origen' : 'Cuenta / Método'}</label><select className="w-full p-3 rounded text-xs" value={form.cuentaOrigen} onChange={e=>setForm({...form, cuentaOrigen: e.target.value})}>{data.cuentas.map(c=><option key={c.nombre}>{c.nombre}</option>)}</select></div>
                                    { (form.tipoOperacion === 'Transferencia' || form.tipoOperacion === 'Abono') ? (
                                        <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Cuenta Destino</label><select className="w-full p-3 rounded text-xs" value={form.cuentaDestino} onChange={e=>setForm({...form, cuentaDestino: e.target.value})}>{data.cuentas.map(c=><option key={c.nombre}>{c.nombre}</option>)}</select></div>
                                    ) : form.tipoOperacion === 'Gasto' ? (
                                        <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Distribución</label><select className="w-full p-3 rounded text-xs" value={form.tipoGasto} onChange={e=>setForm({...form, tipoGasto: e.target.value})}><option>Compartido (50/50)</option><option>Personal Josué</option><option>Personal Abi</option></select></div>
                                    ) : null }
                                </div>

                                <button onClick={registrar} className="w-full bg-[#2dd4bf] text-black font-black p-4 rounded mt-4 uppercase text-xs hover:bg-white transition-all shadow-[0_0_15px_rgba(45,212,191,0.2)]">Asentar Operación</button>
                            </div>
                        </div>
                    )}

                    {view === 'dash' && <Dashboard rawLogs={data.rawLogs} presupuesto={data.presupuesto} cuentas={data.cuentas} />}
                    {view === 'cuentas' && <CuentasManager cuentas={data.cuentas} logs={data.rawLogs} loadData={loadData} />}
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
