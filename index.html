<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Finance Lab ERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; }
        .accent-glow { color: #2dd4bf; text-shadow: 0 0 8px rgba(45, 212, 191, 0.3); }
        input, select { background: #111 !important; border: 1px solid #222 !important; color: white !important; }
        input:focus, select:focus { border-color: #2dd4bf !important; outline: none; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const API_URL = "https://script.google.com/macros/s/AKfycbweLm3Vqu8_9LusW0Y24jzkzw2IuTr7XHoWyuSKN_kIfJshRdkWXpV34tdjmmYUg2Yv/exec"; 

        const apiCall = async (action, payload = null) => {
            const res = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
            const text = await res.text();
            const json = JSON.parse(text);
            if (!json.success) throw new Error(json.error);
            return json.data;
        };

        const getHoyStr = () => new Date(new Date() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];

        // --- COMPONENTE LOGIN (BÓVEDA) ---
        const LoginVault = ({ usuarios, onLogin }) => {
            const [pin, setPin] = useState('');
            const [error, setError] = useState(false);

            const handleUnlock = () => {
                const user = usuarios.find(u => u.pin === pin);
                if (user) onLogin(user);
                else { setError(true); setPin(''); setTimeout(() => setError(false), 2000); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="glass-card p-8 w-full max-w-sm text-center fade-in">
                        <h1 className="text-3xl font-black uppercase tracking-tighter mb-2">Finance<span className="text-teal-500">Lab</span></h1>
                        <p className="text-[10px] text-zinc-500 tracking-[0.3em] mb-8">ACCESO RESTRINGIDO</p>
                        <input type="password" placeholder="PIN DE SEGURIDAD" className={`w-full p-4 text-center font-black tracking-[0.5em] rounded mb-4 ${error ? 'border-rose-500 text-rose-500' : 'text-teal-400'}`} value={pin} onChange={e => setPin(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleUnlock()} />
                        <button onClick={handleUnlock} className="w-full bg-[#2dd4bf] text-black font-black p-4 rounded uppercase tracking-widest text-xs hover:bg-white transition-colors">Desbloquear</button>
                    </div>
                </div>
            );
        };

        // --- TABLERO DE CUENTAS (NET WORTH) ---
        const CuentasView = ({ logs, cuentas, currentUser }) => {
            const myCuentas = useMemo(() => cuentas.filter(c => currentUser.rol === 'Admin' || c.propietario === currentUser.nombre), [cuentas, currentUser]);
            
            const resumen = useMemo(() => {
                let act = 0, pas = 0;
                myCuentas.forEach(c => {
                    let flujo = c.saldoInicial;
                    // Sumar ingresos, restar gastos asignados a esta cuenta
                    logs.filter(l => l.Metodo_Pago === c.nombre).forEach(l => {
                        if (l.Tipo_Operacion === 'Ingreso') flujo += Number(l.Monto_Total);
                        else if (l.Tipo_Operacion === 'Gasto') flujo -= Number(l.Monto_Total);
                    });
                    
                    if (c.tipo === 'Activo') act += flujo;
                    if (c.tipo === 'Pasivo') pas += (flujo * -1); // El pasivo se vuelve positivo para lectura humana de deuda
                });
                return { activos: act, pasivos: pas, neto: act - pas };
            }, [logs, myCuentas]);

            return (
                <div className="fade-in space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="glass-card p-6 border-t-4 border-teal-500"><p className="text-[10px] text-zinc-500 uppercase tracking-widest">Activos Liquidos</p><p className="text-3xl font-bold text-white mt-1">${resumen.activos.toLocaleString()}</p></div>
                        <div className="glass-card p-6 border-t-4 border-rose-500"><p className="text-[10px] text-zinc-500 uppercase tracking-widest">Pasivos (Deuda Tarjetas)</p><p className="text-3xl font-bold text-rose-500 mt-1">${resumen.pasivos.toLocaleString()}</p></div>
                        <div className="glass-card p-6 border-t-4 border-indigo-500"><p className="text-[10px] text-zinc-500 uppercase tracking-widest">Patrimonio Neto</p><p className="text-3xl font-bold text-indigo-400 mt-1">${resumen.neto.toLocaleString()}</p></div>
                    </div>
                    <div className="glass-card overflow-x-auto">
                        <table className="w-full text-left text-[11px] whitespace-nowrap">
                            <thead className="bg-zinc-900 text-zinc-400 uppercase font-bold"><tr><th className="p-3">Cuenta</th><th className="p-3">Propietario</th><th className="p-3">Clasificación</th><th className="p-3 text-right">Flujo Actual</th></tr></thead>
                            <tbody className="divide-y divide-zinc-900">
                                {myCuentas.map((c, i) => {
                                    let flujo = c.saldoInicial;
                                    logs.filter(l => l.Metodo_Pago === c.nombre).forEach(l => {
                                        if (l.Tipo_Operacion === 'Ingreso') flujo += Number(l.Monto_Total);
                                        else if (l.Tipo_Operacion === 'Gasto') flujo -= Number(l.Monto_Total);
                                    });
                                    return (
                                        <tr key={i} className="hover:bg-zinc-900/50">
                                            <td className="p-3 font-bold text-teal-400">{c.nombre}</td><td className="p-3 text-zinc-500">{c.propietario}</td><td className="p-3"><span className={`px-2 py-1 rounded ${c.tipo === 'Activo' ? 'bg-teal-500/20 text-teal-500' : 'bg-rose-500/20 text-rose-500'}`}>{c.tipo}</span></td><td className={`p-3 font-mono text-right font-bold ${flujo < 0 ? 'text-rose-500' : 'text-white'}`}>${flujo.toLocaleString()}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null); // Estado de sesión
            const [view, setView] = useState('gasto'); 
            const [loading, setLoading] = useState(true);
            const [data, setData] = useState({ logs: [], cuentas: [], usuarios: [], arbolCat: {} });
            
            const [form, setForm] = useState({ fechaCompra: getHoyStr(), tipoOperacion: 'Gasto', macroCategoria: 'General', categoria: '', cuenta: '', compra: '', monto: '', tipoGasto: 'Compartido (50/50)', etiquetas: '', msi: '1' });

            useEffect(() => {
                apiCall('getAppData').then(res => {
                    setData(res);
                    if(res.cuentas.length > 0) setForm(f => ({...f, cuenta: res.cuentas[0].nombre}));
                    setLoading(false);
                }).catch(e => { setLoading(false); alert("Error de Sincronización API."); });
            }, []);

            if (loading) return <div className="min-h-screen flex items-center justify-center font-mono text-zinc-500 animate-pulse text-xs uppercase tracking-widest">Sincronizando Bóveda...</div>;
            if (!user) return <LoginVault usuarios={data.usuarios} onLogin={setUser} />;

            const macros = Object.keys(data.arbolCat);
            const subCats = data.arbolCat[form.macroCategoria] || [];
            const cuentasPermitidas = data.cuentas.filter(c => user.rol === 'Admin' || c.propietario === user.nombre || c.propietario === 'Hogar');

            const saveOperacion = () => {
                if(!form.monto || !form.compra) return alert("Faltan datos");
                setLoading(true);
                apiCall('registrarOperacion', { ...form, registrador: user.nombre }).then(() => {
                    alert("Registrado correctamente");
                    window.location.reload();
                });
            };

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-6 pb-20">
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-zinc-900 pb-6 gap-4">
                        <div>
                            <h1 className="text-2xl font-black uppercase tracking-tighter">Finance<span className="text-teal-500">Lab</span></h1>
                            <p className="text-[9px] text-zinc-500 tracking-[0.3em]">HOGAR • AUTORIZADO: {user.nombre.toUpperCase()}</p>
                        </div>
                        <nav className="flex gap-2 bg-zinc-900/50 p-1 rounded border border-zinc-800">
                            {['gasto', 'cuentas'].map(v => (
                                <button key={v} onClick={() => setView(v)} className={`px-4 py-2 text-[10px] font-bold uppercase rounded transition-colors ${view === v ? 'bg-[#2dd4bf] text-black' : 'text-zinc-500 hover:text-white'}`}>{v}</button>
                            ))}
                        </nav>
                    </header>

                    {view === 'gasto' && (
                        <div className="glass-card p-6 md:p-8 max-w-2xl mx-auto fade-in">
                            <h2 className="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-6 border-b border-zinc-800 pb-2">Registro de Operaciones</h2>
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Tipo</label><select className="w-full p-3 rounded text-xs" value={form.tipoOperacion} onChange={e=>setForm({...form, tipoOperacion: e.target.value})}><option>Gasto</option><option>Ingreso</option></select></div>
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Fecha</label><input type="date" className="w-full p-3 rounded font-mono text-xs" value={form.fechaCompra} onChange={e=>setForm({...form, fechaCompra: e.target.value})} /></div>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Categoría (Macro)</label><select className="w-full p-3 rounded text-xs" value={form.macroCategoria} onChange={e=>setForm({...form, macroCategoria: e.target.value, categoria: data.arbolCat[e.target.value]?.[0] || ''})}>{macros.map(m=><option key={m}>{m}</option>)}</select></div>
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Sub Categoría</label><select className="w-full p-3 rounded text-xs" value={form.categoria} onChange={e=>setForm({...form, categoria: e.target.value})}>{subCats.map(c=><option key={c}>{c}</option>)}</select></div>
                                </div>

                                <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Descripción</label><input className="w-full p-3 rounded text-xs" placeholder="Concepto..." value={form.compra} onChange={e=>setForm({...form, compra: e.target.value})} /></div>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Monto Total</label><input type="number" className="w-full p-3 rounded font-mono text-xl text-teal-400" placeholder="0.00" value={form.monto} onChange={e=>setForm({...form, monto: e.target.value})} /></div>
                                    <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Cuenta / Origen</label><select className="w-full p-3 rounded text-xs" value={form.cuenta} onChange={e=>setForm({...form, cuenta: e.target.value})}>{cuentasPermitidas.map(c=><option key={c.nombre} value={c.nombre}>{c.nombre} ({c.tipo})</option>)}</select></div>
                                </div>

                                <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Micro-Etiquetas (Hashtags)</label><input className="w-full p-3 rounded text-xs text-indigo-300 font-mono" placeholder="Ej. #michu, #viajeOaxaca..." value={form.etiquetas} onChange={e=>setForm({...form, etiquetas: e.target.value})} /></div>

                                {form.tipoOperacion === 'Gasto' && (
                                    <div className="grid grid-cols-2 gap-4 border-t border-zinc-800 pt-4 mt-2">
                                        <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">División de Deuda</label><select className="w-full p-3 rounded text-xs" value={form.tipoGasto} onChange={e=>setForm({...form, tipoGasto: e.target.value})}><option>Compartido (50/50)</option><option value="Proporcional">Proporcional</option><option>Personal Josué</option><option>Personal Abi</option></select></div>
                                        <div><label className="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">MSI (Meses)</label><input type="number" min="1" className="w-full p-3 rounded text-xs font-mono" value={form.msi} onChange={e=>setForm({...form, msi: e.target.value})} /></div>
                                    </div>
                                )}

                                <button onClick={saveOperacion} className="w-full bg-[#2dd4bf] text-black font-black p-4 rounded mt-6 uppercase tracking-widest text-xs hover:bg-white transition-colors shadow-[0_0_15px_rgba(45,212,191,0.2)]">Asentar Operación</button>
                            </div>
                        </div>
                    )}

                    {view === 'cuentas' && <CuentasView logs={data.logs} cuentas={data.cuentas} currentUser={user} />}
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
